<main class="login">
  <section class="brand">
    <h1>APEX<br />FIT</h1>
    <p>Entrena, asiste y mide tu avance.</p>
  </section>

  <form class="fm" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
    <h2>Crea tu cuenta</h2>
    <p class="fm__sub">Empieza a entrenar con ApexFit.</p>

    <div class="par">
      <label>
        Nombre
        <span class="ig">
          <input type="text" formControlName="nombre" autocomplete="given-name" />
        </span>
        @if (form.controls.nombre.touched && form.controls.nombre.invalid) {
          <small class="field-error" role="alert">El nombre es obligatorio.</small>
        }
      </label>
      <label>
        Apellido
        <span class="ig">
          <input type="text" formControlName="apellido" autocomplete="family-name" />
        </span>
        @if (form.controls.apellido.touched && form.controls.apellido.invalid) {
          <small class="field-error" role="alert">El apellido es obligatorio.</small>
        }
      </label>
    </div>

    <label>
      Correo
      <span class="ig">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 7l9 6 9-6" />
        </svg>
        <input type="email" formControlName="correo" autocomplete="email" placeholder="tucorreo@apexfit.com" />
      </span>
      @if (form.controls.correo.touched && form.controls.correo.invalid) {
        <small class="field-error" role="alert">Escribe un correo válido.</small>
      }
    </label>

    <label>
      Teléfono (opcional)
      <span class="ig">
        <input type="tel" inputmode="numeric" formControlName="telefono" autocomplete="tel" placeholder="3001234567" />
      </span>
      @if (form.controls.telefono.touched && form.controls.telefono.invalid) {
        <small class="field-error" role="alert">Usa solo números, entre 7 y 15 dígitos.</small>
      }
    </label>

    <label>
      Contraseña
      <span class="ig">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10" rx="2" />
          <path d="M8 10V7a4 4 0 018 0v3" />
        </svg>
        <input type="password" formControlName="contrasena" autocomplete="new-password" placeholder="Mínimo 6 caracteres" />
      </span>
      @if (form.controls.contrasena.touched && form.controls.contrasena.invalid) {
        <small class="field-error" role="alert">Debe tener al menos 6 caracteres.</small>
      }
    </label>

    <label>
      Repite la contraseña
      <span class="ig">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10" rx="2" />
          <path d="M8 10V7a4 4 0 018 0v3" />
        </svg>
        <input type="password" formControlName="confirmar" autocomplete="new-password" />
      </span>
      @if (form.controls.confirmar.touched && form.controls.confirmar.invalid) {
        <small class="field-error" role="alert">Repite tu contraseña.</small>
      } @else if (form.controls.confirmar.touched && form.hasError('noCoinciden')) {
        <small class="field-error" role="alert">Las contraseñas no coinciden.</small>
      }
    </label>

    @if (error(); as mensaje) {
      <p class="form-error" role="alert">{{ mensaje }}</p>
    }

    <button class="af-btn af-btn--block" type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Creando cuenta…' : 'Crear cuenta' }}
    </button>

    <p class="fm__alt">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </form>
</main>
