<!-- Burbuja flotante FAB -->
<button
  type="button"
  class="chat-fab"
  [class.chat-fab--abierto]="abierto()"
  (click)="alternarChat()"
  [attr.aria-expanded]="abierto()"
  aria-label="Abrir asistente virtual ApexFit"
>
  @if (abierto()) {
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 6L6 18M6 6l12 12" />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
    </svg>
    <span class="chat-fab__badge">IA</span>
  }
</button>

<!-- Ventana de Chatbot -->
@if (abierto()) {
  <section class="chat-panel" role="dialog" aria-label="Asistente virtual de ApexFit">
    <!-- Cabecera -->
    <header class="chat-panel__header">
      <div class="chat-panel__titulo">
        <span class="chat-panel__avatar" aria-hidden="true">🤖</span>
        <div>
          <h3>ApexFit AI</h3>
          <p class="chat-panel__sub">Asistente Virtual</p>
        </div>
      </div>
      <div class="chat-panel__acciones">
        <button
          type="button"
          class="chat-btn-icono"
          (click)="limpiar()"
          title="Reiniciar conversación"
          aria-label="Reiniciar conversación"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5" />
          </svg>
        </button>
        <button
          type="button"
          class="chat-btn-icono"
          (click)="cerrar()"
          title="Cerrar chat"
          aria-label="Cerrar chat"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Historial de Mensajes -->
    <div class="chat-panel__mensajes" #mensajesContainer>
      @for (msg of chatService.historial(); track $index) {
        <div class="chat-mensaje" [class.chat-mensaje--usuario]="msg.role === 'user'" [class.chat-mensaje--asistente]="msg.role === 'assistant'">
          <div class="chat-mensaje__burbuja">
            <p>{{ msg.content }}</p>
            @if (msg.hora) {
              <span class="chat-mensaje__hora">{{ msg.hora }}</span>
            }
          </div>
        </div>
      }

      <!-- Indicador de carga / Pensando -->
      @if (chatService.cargando()) {
        <div class="chat-mensaje chat-mensaje--asistente">
          <div class="chat-mensaje__burbuja chat-mensaje__burbuja--cargando">
            <span class="punto"></span>
            <span class="punto"></span>
            <span class="punto"></span>
          </div>
        </div>
      }
    </div>

    <!-- Formulario de Entrada -->
    <form class="chat-panel__footer" (submit)="enviar($event)">
      <input
        #inputMensaje
        type="text"
        class="chat-input"
        placeholder="Escribe tu consulta..."
        [disabled]="chatService.cargando()"
        autocomplete="off"
      />
      <button
        type="submit"
        class="chat-btn-enviar"
        [disabled]="chatService.cargando()"
        aria-label="Enviar mensaje"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
        </svg>
      </button>
    </form>
  </section>
}
