spring:
  datasource:
    url: jdbc:mysql://${RDS_HOSTNAME}:${RDS_PORT}/${RDS_DB_NAME}?useSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    show-sql: false

  flyway:
    enabled: true
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

apexfit:
  app:
    jwtSecret: ${JWT_SECRET:ApexFitSecretKeyMustBeAtLeast32BytesLongForHS256Algorithm}
    jwtExpirationMs: 86400000  # 24 horas
