spring:
  application:
    name: ApexFit
  profiles:
    active: ${APP_PROFILE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway handles the DDL

springdoc:
  override-with-generic-response: false

# Integración con Google Gemini AI para el asistente virtual
gemini:
  api:
    key: ${GEMINI_API_KEY:${ANTHROPIC_API_KEY:}}

logging:
  level:
    com.apexfit: INFO
    org.springframework.web: DEBUG
